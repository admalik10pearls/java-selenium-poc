name: CI — Java Maven Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Check environment
        run: |
          java -version
          mvn -version

      - name: Run Maven tests
        env:
          app_password: ${{ secrets.app_password }}
        run: mvn clean test --batch-mode
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 📊 Test Execution Summary
              
            ${{ (steps.deployment.outcome == 'success' && format('✅ **Allure Report:** [🔍 Click to View Results]({0})', steps.deployment.outputs.page_url)) || '❌ **Allure Report:** Deployment failed.' }}
              
            - **Action Run:** [⚙️ View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          comment_tag: allure-report-link