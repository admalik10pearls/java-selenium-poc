name: CI — Java Maven Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Check environment
        run: |
          java -version
          mvn -version

      - name: Run Maven tests
        env:
          app_password: ${{ secrets.app_password }}
        run: mvn clean test --batch-mode

      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p allure-results
            
          if [ -d "gh-pages-history/history" ]; then
            echo "Found previous history. Copying to results..."
            mkdir -p allure-results/history
            cp -r gh-pages-history/history/* allure-results/history/
          else
            echo "No previous history found. Skipping copy."
          fi

          mvn allure:report

      - name: Upload Allure HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: target/allure-report

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/allure-report
          destination_dir: allure-results/${{ github.run_id }}
      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 📊 Allure Test Report
            The latest test results have been generated and deployed.
              
            **Report URL:** [View Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-results/${{ github.run_id }}/)
              
            _Built by GitHub Actions run #${{ github.run_number }}_
          comment_tag: allure-report-link
