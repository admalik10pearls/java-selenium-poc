name: CI — Java Maven Tests & Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # This registers standard Java error matchers automatically
      - name: Register Problem Matchers
        run: echo "::add-matcher::.github/checkstyle-matcher.json"
        continue-on-error: true

      - name: Run Maven Tests & Quality Gates
        id: maven_run
        env:
          app_password: ${{ secrets.app_password }}
        # 'verify' triggers Checkstyle -> PMD -> SpotBugs -> Tests
        run: mvn clean verify --batch-mode
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 📊 CI Execution Summary
            
            ${{ steps.maven_run.outcome == 'success' && '✅ **Build Passed:** All tests and quality gates passed.' || '🚨 **Build Issues Found:** Please review the "Files Changed" tab or Allure report.' }}

            ---
            
            #### 🛠️ Quality Gate & Test Status
            | Check Type | Status |
            | :--- | :--- |
            | **Functional Tests** | ${{ steps.maven_run.outcome == 'success' && '✅ Pass' || '⚠️ Check Logs' }} |
            | **Static Analysis (PMD/SpotBugs)** | ${{ steps.maven_run.outcome == 'success' && '✅ Clear' || '🚨 Violation Found' }} |
            
            ${{ (steps.deployment.outcome == 'success' && format('🔗 **Allure Report:** [🔍 View Results]({0})', steps.deployment.outputs.page_url)) || '❌ **Report:** Deployment failed.' }}
            
            - **Action Run:** [⚙️ View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          comment_tag: allure-report-link

      - name: Upload Raw Quality Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-quality-reports
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml